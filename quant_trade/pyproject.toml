[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttrade"
version = "0.1.0"
description = "Production-ready quant trading system skeleton"
authors = [{name = "Quant Team", email = "team@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["quant", "trading", "backtesting", "execution", "risk"]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyarrow>=14",
    "requests>=2.32",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.3",
]

[tool.ruff]
line-length = 100
extend-select = ["B", "C4", "ICN", "PT", "RET", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
